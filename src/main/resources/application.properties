spring.application.name=aalastays-backend
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Server
server.port=${SERVER_PORT:5000}

# Application
aalago.store.path=${STORE_PATH:data/store.json}
aalago.upload.dir=${UPLOAD_DIR:uploads}
# Public address used in upload URLs. Set PUBLIC_URL in production, for example
# https://aalago.com/backend (omit the trailing slash).
aalago.public-url=${PUBLIC_URL:}

# Image upload limit. Keep this in sync with UploadService validation.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT
aalago.jwt.secret=${JWT_SECRET:aalago-dev-secret}

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Google Places
google.places.api.key=${GOOGLE_PLACES_API_KEY:}

# Admin
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
